name: Перевірка графіка відключень

on:
  workflow_dispatch:          # запускає cron-job.org кожні 5 хвилин (і кнопка «Run workflow»)
  schedule:
    - cron: "*/30 * * * *"   # запасний варіант, якщо cron-job.org не спрацює

permissions:
  contents: write             # щоб зберігати state.json у репозиторій

concurrency:
  group: svitlo-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main           # завжди найсвіжіший стан, а не той, що був на момент виклику

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Перевірити графік
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          QUEUE: ${{ vars.QUEUE }}
          NOTIFY_ALL: ${{ vars.NOTIFY_ALL }}
        run: python bot.py

      - name: Зберегти стан
        run: |
          git config user.name "svitlo-bot"
          git config user.email "svitlo-bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Оновлено стан графіка [skip ci]"
            for i in 1 2 3; do
              git push && break
              git pull --rebase -X theirs origin main
            done
          fi
